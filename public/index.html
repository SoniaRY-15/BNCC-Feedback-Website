<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNCC Feedback System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">BNCC Feedback System</h1>
            <div class="nav-buttons">
                <button class="nav-btn active" id="btnForm" onclick="showView('form')">Feedback Form</button>
                <button class="nav-btn" id="btnAdmin" onclick="showView('admin')">Admin Panel</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Feedback Form View -->
        <div id="formView" class="view active">
            <div class="form-card">
                <h2 class="form-title">Event Feedback Form</h2>
                <p class="form-subtitle">Bantu kami meningkatkan acara BNCC dengan feedback Anda</p>
                
                <div class="form-group">
                    <label>Nama Lengkap *</label>
                    <input type="text" id="name" placeholder="Masukkan nama lengkap">
                </div>

                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" placeholder="email@example.com">
                </div>

                <div class="form-group">
                    <label>Nama Event *</label>
                    <input type="text" id="eventName" placeholder="Contoh: Workshop React.js">
                </div>

                <div class="form-group">
                    <label>Divisi Penyelenggara *</label>
                    <select id="division">
                        <option value="">Pilih Divisi</option>
                        <option value="LnT">LnT (Learning and Training)</option>
                        <option value="EEO">EEO (External Event Organizer)</option>
                        <option value="PR">PR (Public Relations)</option>
                        <option value="HRD">HRD (Human Resource Development)</option>
                        <option value="RnD">RnD (Research and Development)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Rating Event (1-5) *</label>
                    <div class="rating-container">
                        <button type="button" class="rating-btn" data-rating="1" onclick="selectRating(1)">1</button>
                        <button type="button" class="rating-btn" data-rating="2" onclick="selectRating(2)">2</button>
                        <button type="button" class="rating-btn" data-rating="3" onclick="selectRating(3)">3</button>
                        <button type="button" class="rating-btn" data-rating="4" onclick="selectRating(4)">4</button>
                        <button type="button" class="rating-btn active" data-rating="5" onclick="selectRating(5)">5</button>
                    </div>
                    <div class="rating-labels">
                        <span>Sangat Buruk</span>
                        <span>Sangat Baik</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Komentar (Opsional)</label>
                    <textarea id="comment" rows="4" placeholder="Bagikan pengalaman Anda mengikuti event ini..."></textarea>
                </div>

                <div class="form-group">
                    <label>Saran Perbaikan (Opsional)</label>
                    <textarea id="suggestion" rows="4" placeholder="Apa yang bisa kami tingkatkan untuk event selanjutnya?"></textarea>
                </div>

                <button class="btn-submit" onclick="submitFeedback()">
                    <span>📤</span> Kirim Feedback
                </button>
            </div>
        </div>

        <!-- Admin Panel View -->
        <div id="adminView" class="view">
            <div class="admin-card">
                <h2 class="admin-title">Admin Panel - Feedback Management</h2>
                
                <div class="admin-filters">
                    <div class="search-container">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" placeholder="Cari nama, email, atau event..." onkeyup="filterFeedbacks()">
                    </div>
                    
                    <select id="statusFilter" onchange="filterFeedbacks()">
                        <option value="all">Semua Status</option>
                        <option value="open">Open</option>
                        <option value="in-review">In Review</option>
                        <option value="resolved">Resolved</option>
                    </select>
                </div>

                <div id="loadingSpinner" class="loading-spinner" style="display: none;">
                    <div class="spinner"></div>
                    <p>Memuat data...</p>
                </div>

                <div id="emptyState" class="empty-state" style="display: none;">
                    <p>Belum ada feedback yang tersedia</p>
                </div>

                <div id="feedbackList" class="feedback-list"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
